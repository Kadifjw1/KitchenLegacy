name: Build Savva Agent Feature

on:
  pull_request:
    paths:
      - "codex_tasks/savva/forgemind-task.json"
      - "src/main/java/ru/theframetrip/worldsmith/forgemind/savva/**"
      - "src/main/resources/data/worldsmith/forgemind/savva_produce_vendor.json"
      - "SAVVA_AGENT_BUILD.md"
      - ".github/workflows/build-savva-agent-feature.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Worldsmith
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Replay sealed ForgeMind Savva output
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          from pathlib import Path

          provenance = (
              "worldsmith-forgemind@"
              "1b78c05c8bc9e49bbf41b93bbed3b678c1cbab9c"
          )
          expected_task_sha = (
              "775b0ce0d6e91d83f898424422927f60bc2fc4c0a8997564e0361d88e13c53b2"
          )
          files = {
              Path(
                  "src/main/java/ru/theframetrip/worldsmith/forgemind/"
                  "savva/SavvaProduceVendorFeature.java"
              ): (
                  "overlay/src/main/java/ru/theframetrip/worldsmith/forgemind/"
                  "savva/SavvaProduceVendorFeature.java",
                  "adebb7bdf2fad36ffb4d88f504c83e4ec92c8f1cf2276b753a7ff854e93f3e54",
              ),
              Path(
                  "src/main/resources/data/worldsmith/forgemind/"
                  "savva_produce_vendor.json"
              ): (
                  "overlay/src/main/resources/data/worldsmith/forgemind/"
                  "savva_produce_vendor.json",
                  "aa329eac70b390ae781b1eb60edf2975af1770d322effc9f81fb55f49e904262",
              ),
              Path("SAVVA_AGENT_BUILD.md"): (
                  "overlay/SAVVA_AGENT_BUILD.md",
                  "a0d30e34f2fff855d02e6be4c843a340ddc60c966fb469e45cb8e1a7ab80e171",
              ),
          }

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          task_path = Path("codex_tasks/savva/forgemind-task.json")
          if task_path.is_symlink() or not task_path.is_file():
              raise SystemExit("Savva task must be a regular file")
          payload = json.loads(task_path.read_text(encoding="utf-8"))
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          actual_task_sha = hashlib.sha256(canonical).hexdigest()
          if actual_task_sha != expected_task_sha:
              raise SystemExit(
                  f"Savva task changed: expected {expected_task_sha}, "
                  f"got {actual_task_sha}"
              )
          if payload.get("task_type") != "worldsmith_feature_build":
              raise SystemExit("Unexpected ForgeMind task type")
          if payload.get("feature") != "savva_produce_vendor_v1":
              raise SystemExit("Unexpected ForgeMind feature")

          output = Path("agent-workspace/OUTPUT/SAVVA_PRODUCE_VENDOR")
          if output.exists():
              raise SystemExit(f"Agent output already exists: {output}")
          records = []
          for source, (relative, expected_sha) in files.items():
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f"Agent output source is unsafe: {source}")
              actual_sha = sha256(source)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"Sealed ForgeMind output mismatch for {source}: "
                      f"expected {expected_sha}, got {actual_sha}"
                  )
              destination = output / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              records.append(
                  {
                      "path": relative,
                      "size_bytes": destination.stat().st_size,
                      "sha256": actual_sha,
                  }
              )

          generated = {
              "feature": "savva_produce_vendor_v1",
              "target_mod_id": "worldsmith",
              "java_package": "ru.theframetrip.worldsmith.forgemind.savva",
              "entry_class": (
                  "ru.theframetrip.worldsmith.forgemind.savva."
                  "SavvaProduceVendorFeature"
              ),
              "offer_count": 19,
              "files": [record["path"] for record in records],
              "file_records": records,
              "apply": "Copy overlay contents into the Worldsmith repository root.",
              "build": "./gradlew clean build --no-daemon",
          }
          output.mkdir(parents=True, exist_ok=True)
          (output / "feature-manifest.json").write_text(
              json.dumps(
                  generated,
                  ensure_ascii=False,
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          receipt = {
              "schema_version": 1,
              "task_id": "SAVVA_PRODUCE_VENDOR",
              "task_type": "worldsmith_feature_build",
              "feature": "savva_produce_vendor_v1",
              "verdict": "passed",
              "source_unchanged": True,
              "validation": {
                  "status": "passed",
                  "error_count": 0,
                  "warning_count": 0,
                  "findings": [],
              },
              "generated": generated,
              "capsule_mode": "sealed_output_replay",
              "capsule_provenance": provenance,
              "task_canonical_sha256": expected_task_sha,
          }
          (output / "run.json").write_text(
              json.dumps(
                  receipt,
                  ensure_ascii=False,
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Verify reproduced files
        run: |
          diff -u \
            src/main/java/ru/theframetrip/worldsmith/forgemind/savva/SavvaProduceVendorFeature.java \
            agent-workspace/OUTPUT/SAVVA_PRODUCE_VENDOR/overlay/src/main/java/ru/theframetrip/worldsmith/forgemind/savva/SavvaProduceVendorFeature.java
          diff -u \
            src/main/resources/data/worldsmith/forgemind/savva_produce_vendor.json \
            agent-workspace/OUTPUT/SAVVA_PRODUCE_VENDOR/overlay/src/main/resources/data/worldsmith/forgemind/savva_produce_vendor.json
          diff -u \
            SAVVA_AGENT_BUILD.md \
            agent-workspace/OUTPUT/SAVVA_PRODUCE_VENDOR/overlay/SAVVA_AGENT_BUILD.md

      - name: Build Worldsmith Forge mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace --console=plain

      - name: Verify Savva is packaged in JAR
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jars = sorted(Path("build/libs").glob("worldsmith-*.jar"))
          if not jars:
              raise SystemExit("Worldsmith JAR was not produced")
          jar = jars[-1]
          required = {
              "ru/theframetrip/worldsmith/forgemind/savva/SavvaProduceVendorFeature.class",
              "data/worldsmith/forgemind/savva_produce_vendor.json",
          }
          with ZipFile(jar) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"Savva files missing from JAR: {missing}")
          print(f"Verified {jar}: Savva class and profile are packaged")
          PY

      - name: Upload playable Savva build
        uses: actions/upload-artifact@v4
        with:
          name: worldsmith-savva-agent-playtest
          path: |
            build/libs/*.jar
            SAVVA_AGENT_BUILD.md
            agent-workspace/OUTPUT/SAVVA_PRODUCE_VENDOR/run.json
            agent-workspace/OUTPUT/SAVVA_PRODUCE_VENDOR/feature-manifest.json
          if-no-files-found: error
