name: Prah display debug

on:
  pull_request:
    branches:
      - main
    paths:
      - 'build.gradle'
      - 'codex_tasks/prah/**'
      - '.github/workflows/prah-display-debug.yml'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Materialize Krovotok resources
        run: |
          python3 codex_tasks/krovotok/verify_asset_archive.py
          python3 codex_tasks/krovotok/materialize_krovotok_resources.py
      - name: Build with captured log
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --stacktrace 2>&1 | tee gradle-build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prah-display-gradle-log
          path: gradle-build.log
          if-no-files-found: warn
