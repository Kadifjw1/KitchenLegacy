name: Build Savva Food Textures

on:
  pull_request:
    paths:
      - "codex_tasks/savva_food_textures/**"
      - "src/main/resources/assets/worldsmith/textures/item/**"
      - "src/main/resources/assets/worldsmith/models/item/**"
      - "FORGEMIND_FOOD_TEXTURE_BUILD.md"
      - ".github/workflows/build-savva-food-textures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Worldsmith
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install texture verifier dependency
        run: pip install "Pillow>=10.3,<13"

      - name: Verify learned ForgeMind output
        run: python codex_tasks/savva_food_textures/verify_agent_output.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Worldsmith Forge mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace --console=plain

      - name: Verify preference-trained textures inside JAR
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          expected = {
              "tomato": "daea304d6d68a929205db878cce0875a75bd8617cef7507d1c26dd82b840503f",
              "lettuce": "fddd671da5f7a4eae645197415ef8621f8ba7e49af2a5bc9cb2655b14b9e0c81",
              "cucumber": "17cd26131d4e73fe1f7567a1c4cd862b1225be93d25c494d438ff7f97998f876",
              "strawberry": "82b7280d5cc0bf4383c649c2efdbeba30564385807a4d7dc3f3c6f0ec9e8f516",
              "blueberry": "88152298fefca89465a57e12c827d488b058c30b743255e98c1862a0e11718cb",
              "raspberry": "d75fa008b694796e082fb9cba81d2d759b95919c73f16d6dc11a1003433bdad4",
              "pear": "564cab97ce33256f852fa9dd9d723b9fa53de0d9dd2a2c724145a093e37ccfcb",
              "peach": "7e79eba4f52627cdf4e7a37e8991dbf1fb7d598ac0d75fbdea6634ad4eaa9e01",
              "orange": "22d47dd5fbbe35bb9b0049d43ded8c1486ad12655860d48c9a648e0cf87164ca",
          }
          jars = sorted(Path("build/libs").glob("worldsmith-*.jar"))
          if not jars:
              raise SystemExit("Worldsmith JAR was not produced")
          jar = jars[-1]
          with ZipFile(jar) as archive:
              for item_id, expected_sha in expected.items():
                  name = f"assets/worldsmith/textures/item/{item_id}.png"
                  payload = archive.read(name)
                  actual = hashlib.sha256(payload).hexdigest()
                  if actual != expected_sha:
                      raise SystemExit(f"JAR texture hash mismatch for {name}: {actual}")
          print(f"Verified {jar}: learned ForgeMind food textures are packaged")
          PY

      - name: Upload preference-trained playtest build
        uses: actions/upload-artifact@v4
        with:
          name: worldsmith-forgemind-preference-trained-food-playtest
          path: |
            build/libs/*.jar
            FORGEMIND_FOOD_TEXTURE_BUILD.md
            codex_tasks/savva_food_textures/forgemind-task.json
            codex_tasks/savva_food_textures/texture-report.json
            codex_tasks/savva_food_textures/preference-gate-report.json
            codex_tasks/savva_food_textures/agent-run.json
          if-no-files-found: error
